<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Machine Punch</title>
<style>
  :root {
    --ink: #16181c;
    --panel: #1f232a;
    --line: #33383f;
    --amber: #f2a541;
    --amber-dim: #8a6a2f;
    --ok: #3fb27f;
    --warn: #e0b23a;
    --err: #e2564f;
    --text: #f2f0eb;
    --text-dim: #9aa0aa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  .machine-tag {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .machine-tag .label {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .machine-tag .id {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--text-dim);
    display: inline-block;
    margin-right: 6px;
  }
  .status-dot.live { background: var(--ok); }

  /* --- Currently running card --- */
  .running-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
  }
  .running-card .eyebrow {
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 8px;
  }
  .running-card .op-name { font-size: 24px; font-weight: 700; }
  .running-card .since { color: var(--text-dim); font-size: 14px; margin-top: 4px; }

  /* --- Reconciliation panel (shown mid punch-out) --- */
  .recon-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .recon-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .recon-row:last-child { border-bottom: none; }
  .recon-row .val { font-weight: 700; }
  .recon-row.unaccounted .val { color: var(--warn); }
  .recon-row.unaccounted.high .val { color: var(--err); }
  .recon-note {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }

  /* --- Form --- */
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 20px;
    padding: 14px 16px;
    border-radius: 10px;
    outline: none;
    font-family: inherit;
  }
  .field textarea { font-size: 15px; resize: vertical; min-height: 64px; }
  .field input:focus, .field textarea:focus { border-color: var(--amber); }
  .field .hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 18px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-primary { background: var(--amber); color: #1a1204; }
  .btn-primary:active { background: var(--amber-dim); }
  .btn-danger { background: var(--err); color: #fff; }
  .btn-danger:active { opacity: 0.85; }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--text-dim); }

  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok { background: rgba(63,178,127,0.15); color: var(--ok); border: 1px solid rgba(63,178,127,0.3); }
  .msg.err { background: rgba(226,86,79,0.15); color: var(--err); border: 1px solid rgba(226,86,79,0.3); }

  .footer-note {
    margin-top: auto;
    padding-top: 24px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
  }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <div class="machine-tag">
    <div>
      <div class="label"><span class="status-dot" id="connDot"></span>Machine</div>
      <div class="id" id="machineIdDisplay">—</div>
    </div>
  </div>

  <!-- Shown when someone is already punched in -->
  <div id="runningView" class="hidden">
    <div class="running-card">
      <div class="eyebrow">Currently running</div>
      <div class="op-name" id="runningOpName">—</div>
      <div class="since" id="runningSince">—</div>
    </div>
    <button class="btn-danger" id="punchOutBtn">Punch Out</button>
  </div>

  <!-- Shown after "Punch Out" is tapped, before it's actually finalized -->
  <div id="punchOutConfirmView" class="hidden">
    <div class="field">
      <label for="scrapQty">Scrap Quantity (this shift)</label>
      <input id="scrapQty" type="number" inputmode="numeric" min="0" step="1" value="0">
      <div class="hint">Total rejected/scrap units produced during this shift.</div>
    </div>
    <button class="btn-danger" id="confirmPunchOutBtn">Confirm Punch Out</button>
    <button class="btn-secondary" id="cancelPunchOutBtn">Cancel</button>
  </div>

  <!-- Shown when nobody is punched in -->
  <div id="loginView" class="hidden">
    <div class="field">
      <label for="operatorId">Operator ID</label>
      <input id="operatorId" type="text" inputmode="text" autocomplete="off" placeholder="e.g. OP1023">
    </div>
    <div class="field">
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••">
    </div>
    <button class="btn-primary" id="punchInBtn">Punch In</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="footer-note">
    Scan this machine's QR code again anytime to punch out.<br>
    <a href="production.html" style="color: var(--amber); text-decoration: none;">Production Dashboard</a>
    &nbsp;·&nbsp;
    <a href="dashboard.html" style="color: var(--amber); text-decoration: none;">Login / Operator Dashboard</a>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js';
import { getDatabase, ref, get, set, push, onValue } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyCSF40NhHbv_Vs925-oGSUhEqPdN2Ed6gA",
  authDomain: "withoutrd-id-2.firebaseapp.com",
  databaseURL: "https://withoutrd-id-2-default-rtdb.firebaseio.com",
  projectId: "withoutrd-id-2",
  storageBucket: "withoutrd-id-2.firebasestorage.app",
  messagingSenderId: "422464914098",
  appId: "1:422464914098:web:fbbcfe3bdbf642c662bfab"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// Machine ID comes from the QR code: punch.html?machine=M01
const params = new URLSearchParams(window.location.search);
const machineId = params.get('machine');

const machineIdDisplay = document.getElementById('machineIdDisplay');
const connDot = document.getElementById('connDot');
const runningView = document.getElementById('runningView');
const loginView = document.getElementById('loginView');
const punchOutConfirmView = document.getElementById('punchOutConfirmView');
const runningOpName = document.getElementById('runningOpName');
const runningSince = document.getElementById('runningSince');
const msg = document.getElementById('msg');

function showMsg(text, type) {
  msg.textContent = text;
  msg.className = 'msg show ' + type;
}

if (!machineId) {
  machineIdDisplay.textContent = 'Unknown';
  showMsg('No machine ID found in this QR code. Ask maintenance to reprint it.', 'err');
} else {
  machineIdDisplay.textContent = machineId;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      connDot.classList.add('live');
      watchMachineState();
    } else {
      signInAnonymously(auth).catch((err) => {
        showMsg('Could not connect: ' + err.message, 'err');
      });
    }
  });
}

let currentOpData = null;

function watchMachineState() {
  const currentOpRef = ref(db, `Machines/${machineId}/currentOperator`);
  onValue(currentOpRef, (snapshot) => {
    const data = snapshot.val();
    currentOpData = data;
    if (data && data.operatorId) {
      runningView.classList.remove('hidden');
      loginView.classList.add('hidden');
      punchOutConfirmView.classList.add('hidden');
      runningOpName.textContent = data.name || data.operatorId;
      const since = data.punchInTime ? new Date(data.punchInTime * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
      runningSince.textContent = since ? `Punched in at ${since}` : '';
    } else {
      runningView.classList.add('hidden');
      punchOutConfirmView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }
  });
}

document.getElementById('punchInBtn').addEventListener('click', async () => {
  const operatorId = document.getElementById('operatorId').value.trim();
  const pin = document.getElementById('pin').value.trim();

  if (!operatorId || !pin) {
    showMsg('Enter your Operator ID and PIN.', 'err');
    return;
  }

  try {
    const opSnap = await get(ref(db, `Operators/${operatorId}`));
    if (!opSnap.exists()) {
      showMsg('Operator ID not found.', 'err');
      return;
    }
    const opData = opSnap.val();
    if (String(opData.pin) !== pin) {
      showMsg('Incorrect PIN.', 'err');
      return;
    }

    const punchInTime = Math.floor(Date.now() / 1000); // seconds, to match ESP32 timestamps
    const sessionRef = push(ref(db, `Sessions/${machineId}`));
    await set(sessionRef, {
      operatorId,
      name: opData.name || operatorId,
      punchIn: punchInTime,
      punchOut: null,
      status: 'open'
    });

    await set(ref(db, `Machines/${machineId}/currentOperator`), {
      operatorId,
      name: opData.name || operatorId,
      punchInTime,
      sessionId: sessionRef.key
    });

    showMsg('Punched in. Production will now be credited to you.', 'ok');
    document.getElementById('pin').value = '';
  } catch (err) {
    showMsg('Punch in failed: ' + err.message, 'err');
  }
});

/* ---------- Punch out: step 1, capture scrap qty ---------- */
document.getElementById('punchOutBtn').addEventListener('click', () => {
  if (!currentOpData) return;
  runningView.classList.add('hidden');
  punchOutConfirmView.classList.remove('hidden');
  document.getElementById('scrapQty').value = '0';
});

document.getElementById('cancelPunchOutBtn').addEventListener('click', () => {
  punchOutConfirmView.classList.add('hidden');
  runningView.classList.remove('hidden');
});

/* ---------- Punch out: step 2, finalize ---------- */
document.getElementById('confirmPunchOutBtn').addEventListener('click', async () => {
  try {
    const currentOpSnap = await get(ref(db, `Machines/${machineId}/currentOperator`));
    const currentOp = currentOpSnap.val();
    if (!currentOp) return;

    const scrapQty = parseInt(document.getElementById('scrapQty').value, 10) || 0;
    const punchOutTime = Math.floor(Date.now() / 1000);

    if (currentOp.sessionId) {
      await set(ref(db, `Sessions/${machineId}/${currentOp.sessionId}/punchOut`), punchOutTime);
      await set(ref(db, `Sessions/${machineId}/${currentOp.sessionId}/status`), 'closed');
      await set(ref(db, `Sessions/${machineId}/${currentOp.sessionId}/scrapQty`), scrapQty);
    }

    await set(ref(db, `Machines/${machineId}/currentOperator`), null);
    punchOutConfirmView.classList.add('hidden');
    showMsg('Punched out. Thanks!', 'ok');
  } catch (err) {
    showMsg('Punch out failed: ' + err.message, 'err');
  }
});
</script>
</body>
</html>
